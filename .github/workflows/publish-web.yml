name: build-and-publish-web

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 已验证并合入私有源码 main 的完整提交 SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: verify and export Godot Web
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate source identity
        run: |
          node -e 'if (!/^[0-9a-f]{40}$/.test(process.env.SOURCE_SHA)) throw new Error("需要完整源码提交 SHA")'

      - name: Read private source main
        uses: actions/checkout@v4
        with:
          repository: gongfpp/monkey-shakespeare
          ref: main
          path: source
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          persist-credentials: false

      - name: Verify exact source commit
        working-directory: source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Scan source for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o /tmp/gitleaks-checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          python3 - <<'PY'
          import hashlib, os, pathlib
          name = f"gitleaks_{os.environ['GITLEAKS_VERSION']}_linux_x64.tar.gz"
          expected = next(line.split()[0] for line in pathlib.Path('/tmp/gitleaks-checksums.txt').read_text().splitlines() if line.endswith(name))
          assert hashlib.sha256(pathlib.Path('/tmp/gitleaks.tar.gz').read_bytes()).hexdigest() == expected
          PY
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git source --log-opts="-1" --redact --no-banner

      - name: Install matching Godot
        run: |
          curl -fsSL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 0755 /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Import resources
        working-directory: source
        run: godot --headless --path . --editor --import --quit

      - name: Verify rules, content and saves
        working-directory: source
        run: npm run verify
        timeout-minutes: 25

      - name: Fetch matching export templates
        working-directory: source
        run: python3 tools/fetch-web-templates.py --version 4.7.2

      - name: Export release
        working-directory: source
        run: npm run ea:release

      - name: Upload only Web build
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/tmp/godot-web

  deploy:
    name: deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified build
        id: deployment
        uses: actions/deploy-pages@v4
